[project]
name = "lns-server"
version = "0.1.0"
description = "Living Node Swarm local FastAPI server"
requires-python = ">=3.11"
dependencies = [
  "lns-kernel",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.sources]
"src/lns_server" = "lns_server"

[tool.hatch.build.targets.wheel]
packages = ["src/lns_server"]

[tool.uv.sources]
lns-kernel = { path = "../lns_kernel", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../lns_kernel/src"]
